async function aktifkanNotifHP(silent = false) {

    await fetch('/api/push?action=subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });

  } catch (e) { 
    if(!silent) showToast('Gagal aktifkan notif: ' + e.message); 
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function doLogin() {
  const u = $('#l-user').value.trim(), p = $('#l-pass').value;
  if (!u || !p) return showToast('Isi Gmail/Username dan password!');
  const hash = await sha256(p);
  const user = DB.users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.pass === hash);
  if (!user) return showToast('Akun / Password salah!');
  if (user.status === 'blocked') return showToast('Akun diblokir!');
  
  DB.session = user.id; saveDB(); render();
  setTimeout(() => { mintaIzinNotifAwal(); }, 1500);
}

async function doRegister() {
  const email = $('#r-user').value.trim();
  const name = $('#r-name').value.trim();
  const p = $('#r-pass').value;
  const refCode = $('#r-ref').value.trim().toUpperCase();
  
  if (!email || !email.includes('@')) return showToast('Format Gmail tidak valid!');
  if (!name) return showToast('Nama tidak boleh kosong!');
  if (p.length < 6) return showToast('Password minimal 6 karakter!');
  if (DB.users.find(x => x.username.toLowerCase() === email.toLowerCase())) return showToast('Gmail sudah terdaftar!');
  
  let referredById = null;
  if (refCode) {
    const referrer = DB.users.find(u => u.referralCode === refCode);
    if (!referrer) return showToast('Kode Referral tidak valid!');
    
    referrer.saldo = (referrer.saldo || 0) + 100;
    referredById = referrer.id;
    
    pushNotif(referrer.id, '💰 Bonus Referral!', `Selamat, kamu mendapat Rp 100 karena kode referralmu dipakai.`);
  }

  const myRefCode = 'DKK-' + Math.random().toString(36).substring(2, 6).toUpperCase();
  
  const newUser = { 
    id: uid(), username: email, name: name, role: 'user', 
    pass: await sha256(p), status: 'active', saldo: 100, 
    referralCode: myRefCode, referredBy: referredById 
  };
  
  DB.users.push(newUser);
  pushNotif(newUser.id, 'Selamat Datang!', `Halo ${name}, akun berhasil dibuat. Kamu dapat saldo awal Rp 100.`);
  DB.session = newUser.id; saveDB(); render();

  setTimeout(() => { mintaIzinNotifAwal(); }, 1500);
}

function prosesTarik() {
  const user = DB.users.find(u => u.id === DB.session);
  const jumlah = parseInt($('#tarik-jumlah').value);
  const metode = $('#tarik-metode').value;
  const nomor = $('#tarik-nomor').value.trim();
  const nama = $('#tarik-nama').value.trim();

  if (!jumlah || jumlah < 10000) return showToast('Minimal penarikan Rp 10.000!');
  if (jumlah > (user.saldo || 0)) return showToast('Saldo tidak cukup!');
  if (!nomor || !nama) return showToast('Isi nomor dan nama rekening!');

  user.saldo -= jumlah;
  
  const trx = {
    id: uid(), userId: user.id, userName: user.name, amount: jumlah, method: metode,
    accountNumber: nomor, accountName: nama, status: 'Pending', createdAt: Date.now()
  };
  DB.withdrawals.unshift(trx);
  
  saveDB();
  pushNotif(user.id, '⏳ Penarikan Diproses', `Permintaan penarikan Rp ${jumlah.toLocaleString('id-ID')} sedang menunggu konfirmasi Admin.`);
  pushNotif('admin', '🔔 Penarikan Baru!', `User ${user.name} mengajukan penarikan Rp ${jumlah.toLocaleString('id-ID')}.`);
  
  showToast('Permintaan penarikan dikirim!');
  nav('dashboard'); 
}

function suksesTarik(id) {
  const trx = DB.withdrawals.find(t => t.id === id);
  if (trx) {
    trx.status = 'Sukses';
    pushNotif(trx.userId, '✅ Penarikan Sukses', `Saldo Rp ${trx.amount.toLocaleString('id-ID')} telah berhasil ditransfer ke ${trx.method} (${trx.accountNumber}).`);
    saveDB();
    render();
    showToast('Penarikan ditandai sukses!');
  }
}

async function savePred(id = '') {
  const t1 = $('#m-t1').value.trim();
  const t2 = $('#m-t2').value.trim();
  const status = $('#m-stat').value;

  if(!t1 || !t2) return showToast('Isi Admin dan Nama Player!');

  if (id) {
    const p = DB.preds.find(x => x.id === id);
    if (p) {
      p.t1 = t1; p.t2 = t2; p.status = status;
      showToast('Prediksi berhasil diupdate!');
    }
  } else {
    DB.preds.unshift({ id: uid(), t1, t2, pick: 't1', status });
    showToast('Prediksi baru ditambahkan!');
    
    DB.users.filter(u => u.role === 'user').forEach(u => pushNotif(u.id, '🎯 Prediksi Baru!', `${t1} - ${t2}`));
  }
  
  saveDB(); closeModal(); render(); 
}

function delPred(id) { 
  if(confirm('Yakin ingin menghapus prediksi ini?')) { 
    DB.preds = DB.preds.filter(p=>p.id!==id); 
    saveDB(); render(); 
  } 
}

function toggleBlock(id) { 
  const u = DB.users.find(x=>x.id===id); 
  u.status = u.status==='active'?'blocked':'active'; 
  saveDB(); render(); 
}

function copyRef() {
  const refInput = document.getElementById('my-ref-code');
  refInput.select();
  refInput.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(refInput.value);
  showToast('Kode Referral berhasil dicopy!');
}

// Mulai Aplikasi
initDB().then(render);
</script>
</body>
</html>
