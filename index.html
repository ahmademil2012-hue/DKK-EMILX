async function sha256(txt) {
  const buf = new TextEncoder().encode(txt);
  const hash = await crypto.subtle.digest('SHA-256', buf);

async function aktifkanNotifHP(silent = false) {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });

}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function renderPredCard(p, isAdminView) {
  let contentHtml = '';
  if (p.text) {
    contentHtml = `<div style="margin: 10px 0; font-size: 15px; font-weight: 800; color: #fff; line-height: 1.4;">${esc(p.text)}</div>`;
  } else {
    const isPickT1 = p.pick === 'team1';
    const t1Class = isPickT1 ? 'pred-picked' : '';
    const t2Class = !isPickT1 ? 'pred-picked' : '';
    contentHtml = `
      <div class="pred-matchup">
        <div class="team ${t1Class}">${esc(p.t1)}</div>
        <div class="vs">VS</div>
        <div class="team ${t2Class}">${esc(p.t2)}</div>
      </div>
      <div class="pred-footer" style="margin-top: 10px;">
        <div class="pred-pick-text">Pilihan: <b style="color:var(--danger)">${isPickT1 ? p.t1 : p.t2}</b></div>
      </div>
    `;
  }

  return `
    <div class="pred-card" style="border-left: 3px solid ${p.status === 'DONE' ? 'var(--success)' : p.status === 'LOSE' ? 'var(--danger)' : p.status === 'REFF ALL' ? 'var(--warning)' : 'var(--neon)'};">
      <div class="pred-header">

      ${isAdminView ? `
        <div style="display:flex; gap:5px; margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;">
          <button onclick="openPredModal('${p.id}')" style="flex:1; color:var(--neon);font-size:11px;border:1px solid var(--neon);padding:4px;border-radius:5px">Edit</button>

    </div>

}

function toggleMaintenance() {

function prosesTarik() {
  const user = DB.users.find(u => u.id === DB.session);
  const jumlah = parseInt($('#tarik-jumlah').value);
  const metode = $('#tarik-metode').value;
  const nomor = $('#tarik-nomor').value.trim();
  const nama = $('#tarik-nama').value.trim();

  if (!jumlah || jumlah < 10000) return showToast('Minimal penarikan Rp 10.000!');
  if (jumlah > (user.saldo || 0)) return showToast('Saldo tidak cukup!');
  if (!nomor || !nama) return showToast('Isi nomor dan nama rekening!');

  user.saldo -= jumlah;
  const trx = { id: uid(), userId: user.id, userName: user.name, amount: jumlah, method: metode, accountNumber: nomor, accountName: nama, status: 'Pending', createdAt: Date.now() };
  DB.withdrawals.unshift(trx);
  
  saveDB();
  pushNotif(user.id, '⏳ Penarikan Diproses', `Permintaan penarikan Rp ${jumlah.toLocaleString('id-ID')} sedang menunggu konfirmasi Admin.`);
  pushNotif('admin', '🔔 Penarikan Baru!', `User ${user.name} mengajukan penarikan Rp ${jumlah.toLocaleString('id-ID')}.`);
  showToast('Permintaan penarikan dikirim!'); nav('dashboard'); 
}

function suksesTarik(id) {
  const trx = DB.withdrawals.find(t => t.id === id);
  if (trx) {
    trx.status = 'Sukses';
    pushNotif(trx.userId, '✅ Penarikan Sukses', `Saldo Rp ${trx.amount.toLocaleString('id-ID')} telah berhasil ditransfer ke ${trx.method} (${trx.accountNumber}).`);
    saveDB(); render(); showToast('Penarikan ditandai sukses!');
  }
}

async function savePred(id = '') {
  const admin = $('#m-admin').value.trim();
  const type = $('#m-type').value;
  const status = $('#m-stat').value;

  if(!admin) return showToast('Isi Nama Admin!');

  if (type === 'history') {
    const text = $('#m-text').value.trim();
    if (!text) return showToast('Isi Teks Prediksi!');
    
    if (id) {
      const p = DB.preds.find(x => x.id === id);
      if (p) {
        p.admin = admin; p.text = text; p.status = status;
        delete p.t1; delete p.t2; delete p.pick;
        showToast('Prediksi berhasil diupdate!');
      }
    } else {
      DB.preds.unshift({ id: uid(), admin, text, status });
      showToast('Prediksi baru ditambahkan!');
      DB.users.filter(u => u.role === 'user').forEach(u => pushNotif(u.id, '🎯 Prediksi Baru!', `Admin ${admin}: ${text}`));
    }
  } else {
    const t1 = $('#m-t1').value.trim();
    const t2 = $('#m-t2').value.trim();
    const pick = $('#m-pick').value;
    if (!t1 || !t2) return showToast('Isi Tim 1 dan Tim 2!');

    if (id) {
      const p = DB.preds.find(x => x.id === id);
      if (p) {
        p.admin = admin; p.t1 = t1; p.t2 = t2; p.pick = pick; p.status = status;
        delete p.text;
        showToast('Prediksi berhasil diupdate!');
      }
    } else {
      DB.preds.unshift({ id: uid(), admin, t1, t2, pick, status });
      showToast('Prediksi baru ditambahkan!');
      DB.users.filter(u => u.role === 'user').forEach(u => pushNotif(u.id, '🎯 Prediksi Baru!', `Admin ${admin}: ${t1} VS ${t2}`));
    }
  }
  saveDB(); closeModal(); render(); 
}

function delPred(id) { 
  if(confirm('Yakin ingin menghapus prediksi ini?')) { 
    DB.preds = DB.preds.filter(p=>p.id!==id); 
    saveDB(); render(); 
  } 
}

function toggleBlock(id) { 
  const u = DB.users.find(x=>x.id===id); 
  u.status = u.status==='active'?'blocked':'active'; 
  saveDB(); render(); 
}

function copyRef() {
  const refInput = document.getElementById('my-ref-code');
  refInput.select(); refInput.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(refInput.value);
  showToast('Kode Referral berhasil dicopy!');
}

// Mulai Aplikasi saat halaman dimuat
initDB();
</script>
</body>
</html>
